[package]
name = "noodle"
version = "0.5.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Fancy Butler"]
description = "Plug in a MIDI keyboard and play. Instantly."

[dependencies]
cpal = "0.16"
midir = "0.10"
rustysynth = "1"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
hound = "3"
midly = "0.5"
ureq = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 2
